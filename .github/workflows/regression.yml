# 回归（唯一权威：engine/tests/run_all.sh）
#
# ⚠⚠⚠ 2026-10-06（审计 P0-01）：本文件从 `docs/ci-regression.yml` **搬到这里**。
#
#   **为什么搬**（以及为什么当年会挪走）：
#   2026-09-23 它就在这个路径，但被 GitHub 拒收：
#     ! [remote rejected] main -> main (refusing to allow a Personal Access Token to
#       create or update workflow `.github/workflows/regression.yml` without `workflow` scope)
#   本机当时用的 Personal Access Token **没有 `workflow` scope**。
#   当时的两个选项：① 给 token 加 scope ② 把文件挪出 `.github/` —— 选了后者
#   （理由：加 scope 会让 token 权限变宽，而这份 workflow **当时一次都没跑过**）。
#
#   **⚠ 为什么现在不需要 token 加 scope**：
#   Actions 内置的 **`GITHUB_TOKEN`（`secrets.GITHUB_TOKEN` / `github.token`）天生带
#   `workflow` 权限** —— 它由 GitHub 为每次 run 自动签发、作用域仅限本仓本 workflow。
#   ⇒ 搬回来后**用内置 token 推送本文件即可**，个人 PAT 完全不参与。
#   （也可以继续用带 `workflow` scope 的 PAT，但那是"权限最小化"上更差的选择。）
#
#   **搬回来的前置条件（2026-09-24 已实测满足）**：
#   （原 `docs/ci-regression.yml` 那份历史留档已于 2026-10-08 删除 —— 它自陈"别照着改"，
#     且内容已被本文件完全取代；原文在 git 历史里：`git log --all -- docs/ci-regression.yml`）
#   ① 依赖 28 MB 行情快照的 `test_scan_determinism` 已随 Python 参考实现删除；
#   ② 把 `engine/tests/fixtures/2026-09-14/` 下全部 1416 个 gitignored 文件挪走后，
#      `run_all.sh` 全绿；✅ 行数**不在此写死**（护栏 `docs_no_test_count` 就是拦这个的，
#      原先这里写过一个具体数字，早就过期了 —— 以 `run_all.sh` 输出为准）；

#   ③ ⇒ **现在的回归只依赖纳管文件**（`git ls-files` 里的东西），全新 clone 就能跑。

name: 回归（唯一权威：engine/tests/run_all.sh）

# ⚠⚠ 触发器：**push 自动回归已开**（2026-10-12，N-01 收尾）。
#   「首跑先手动、绿了再开 push」是 2026-10-06 建 workflow 时的判据，当天起手动首跑
#   连挂 5 次才拿到第一个 ✅，修掉三个 runner-only 问题（详见各提交）：
#     红① 38237071110 vendored 包 swift-trading-view 谎报平台底档 10.13（实需 13+）
#     红② 38238860589 runner Swift 6.3.3 不产单个 SelectedCore.o（本机 6.4 产）
#     红③③ 38239959652/38240698844 .build/debug 是符号链接，find 不跟随根链接
#   绿：38241456373（@88eb7e3，15 套件 + 全部护栏 全过；当时 42 条，**现条数以
#   `run_all.sh` 的 `GUARD_NAMES` 为准，本文件不再复写这个数字**）⇒ 判据达成，开 push。

on:
  push:
    branches: [main]
  workflow_dispatch:

# ⚠ 默认只读权限。本 workflow 只做 checkout + 构建 + 跑测试，不需要写权限。
#   显式声明（而不是靠默认）是为了：将来有人加 `git push` 类步骤时，
#   GitHub 会因权限不足而**明确失败**，而不是静默地用一个权限过大的 token。
permissions:
  contents: read

# ⚠ 同一分支的并发 run：后一个**取消**前一个（cancel-in-progress）。
#   本仓每次打包都会 `git push origin/main`（build_app.sh:280）⇒ 高频 push 时
#   排队会积压多个完全相同的回归 run，白烧配额还看不出差别。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # ⚠⚠ **必须 macOS 26 + arm64**，两个都是硬约束：
    #
    #   ① **macOS 26**：`Package.swift` 是 `platforms: [.macOS(.v26)]` ＋
    #      `// swift-tools-version:6.2`，而 `.v26` 标着 `@available(_PackageDescription 6.2)`
    #      ⇒ runner 的 Xcode 必须 ≥ 26，否则**连 manifest 都编译不过**
    #      （报 `error: 'v26' is unavailable`）。
    #      ⚠ 原先这里是 `macos-15`（对应 `.macOS(.v15)` / tools 6.0）—— 改最低版本时**必须一起改**。
    #
    #   ② **arm64**（`macos-26` 默认就是 arm64 标准 runner）：本项目**仅支持 Apple Silicon**，
    #      `build_app.sh:56-58` 有 `uname -m` 硬断言。跑在 x64 上等于测了另一个架构。
    #
    # ✅ **标签已核实**（2026-10-06 查 GitHub 官方 changelog）：
    #   `macos-26` 自 **2026-02-26 起正式 GA**（此前是 public preview），
    #   可用标签含 `macos-26`（arm64 标准）/ `macos-26-intel` / `macos-26-large` / `macos-26-xlarge`。
    #   ⇒ 原文件里「⚠ 标签名待核实」的注释**已过时**，删除。
    #   ⚠ **不要**改成 `macos-latest`：当前它指向 macOS 15（arm64），
    #     而本包 `.macOS(.v26)` 的 manifest 会直接编译失败 ⇒ 反而更隐蔽（挂得更早、更难懂）。
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ⚠⚠ 2026-10-06：原有 `actions/setup-python@v5`（锁 3.12 + `pip install requests`）
      #   连同 `PY: ${{ steps.py.outputs.python-path }}` 一起删除 —— 那些是为**已删除的
      #   Python 参考实现**服务的，`run_all.sh` 也已不再解析 `PY`。

      - name: 环境版本（排查用）
        run: |
          sw_vers
          swift --version
          uname -m          # 必须 arm64（P0-01 的架构约束，见上）

      # ⚠ 这里不单独跑 `swift build` / `swift test`：
      #   `run_all.sh` 的 `core_unit`（`swift test`）与 `core_lib.sh`（`swift build`）已完整覆盖编译与单测，
      #   再前置一轮只是重复等待构建。
      # ⚠⚠ **CI 绿 ≠ 选股结果没变**，但也不要写成"什么都没有"（2026-10-16 审查 B7 校准措辞）：
      #   指标库有 `Fixtures/indicator_golden/` 的黄金 CSV **逐点比对**（改种子/平滑口径会报红），
      #   实体层有键集 + JSON 无损往返断言，并覆盖 `Screener` 过滤/打分合成/ETF/`SignalClassifier` 与 `SelectedAppTests` 状态回归。
      - name: 全量回归（唯一权威）
        run: |
          set -o pipefail
          bash engine/tests/run_all.sh 2>&1 | tee /tmp/runall.log

      # 覆盖率基线（多 testTarget 经 --show-codecov-path + llvm-cov report 聚合）
      - name: SelectedCore 覆盖率基线
        if: success()
        working-directory: SelectedApp
        run: |
          SCR="${TMPDIR:-/tmp}/selected-swift-test-build"
          swift test --disable-sandbox --enable-code-coverage --scratch-path "$SCR" >/tmp/cov.log 2>&1
          COV_JSON=$(swift test --disable-sandbox --scratch-path "$SCR" --show-codecov-path)
          COV_DIR=${COV_JSON%/*}
          BIN_DIR=${COV_DIR%/*}
          PROF="$COV_DIR/default.profdata"
          OBJS=()
          while IFS= read -r b; do
            [ -n "$b" ] && OBJS+=("$b")
          done < <(find "$BIN_DIR" -maxdepth 4 -path '*.xctest/Contents/MacOS/*' -type f | sort)
          {
            echo "## SelectedCore 覆盖率基线"
            echo '```'
            if [ "${#OBJS[@]}" -gt 0 ] && [ -f "$PROF" ]; then
              ARGS=("${OBJS[0]}")
              for ((i=1; i<${#OBJS[@]}; i++)); do
                ARGS+=("-object=${OBJS[$i]}")
              done
              xcrun llvm-cov report "${ARGS[@]}" -instr-profile="$PROF" \
                -ignore-filename-regex='\.build|Tests/|LocalPackages/|Sources/SelectedApp/' | tail -40
            else
              echo "❌ 未定位到 .xctest 可执行文件或 default.profdata（COV_JSON=${COV_JSON:-empty}）"
              exit 1
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"



      # ⚠⚠ 仅失败时跑：dump SPM 产物树。2026-10-12 CI 首跑连挂两次的教训 ——
      #   runner（Swift 6.3.3）与本机（6.4）的 SPM 产物布局不同：本机产单个
      #   SelectedCore.o，runner 不产、.build/debug 还是指向别处的符号链接。
      #   没有判型信息就只能猜；有了它，一轮 CI 就能定位。
      - name: 失败排查（.build 布局）
        if: failure()
        run: |
          {
            echo "## .build 布局（失败时自动 dump）"
            echo '```'
            find SelectedApp/.build -maxdepth 4 2>/dev/null | head -80
            echo '```'
            echo "- ls SelectedApp/.build/（前 15 项）："
            ls -la SelectedApp/.build/ 2>/dev/null | head -15
            echo "- ls .build/debug 真实目录（前 30 项）："
            ls -la "$(cd SelectedApp/.build/debug 2>/dev/null && pwd -P)" 2>/dev/null | head -30
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ 把 ✅/❌ 汇总行打进 job summary：Actions UI 里全部静态护栏的输出很长，

      #   只看最后两行的人容易错过中间的 ❌。
      #   ⚠ 必须 `if: always()` —— 回归失败时**恰恰最需要**看到摘要。
      - name: 结果摘要
        if: always()
        run: |
          {
            echo "## 回归结果"
            echo ""
            echo "- ✅ 通过：**$(grep -cE '^✅' /tmp/runall.log 2>/dev/null || echo 0)**"
            echo "- ❌ 失败：**$(grep -cE '^❌' /tmp/runall.log 2>/dev/null || echo 0)**"
            echo ""
            echo '<details><summary>失败项</summary>'
            echo ""
            echo '```'
            grep -E '^❌' /tmp/runall.log 2>/dev/null || echo "（无）"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
